name: Android CI

on:
  push:
    branches:
      - master
      - develop
      - feature/**
      - refactor/**
      - build/**
      - docs/**
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Lint (optional verification)
        run: ./gradlew --no-daemon :app:lint
        continue-on-error: true
